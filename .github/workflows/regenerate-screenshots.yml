name: Regenerate Screenshots

on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: macos-latest
    permissions:
      contents: write
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests and update snapshots
        run: npm run test:e2e:update-snapshots
        env:
          CI: true
          # Provide dummy values for build/runtime to succeed
          VITE_GOOGLE_API_KEY: "dummy"
          VITE_GOOGLE_CLIENT_ID: "dummy"
          VITE_GOOGLE_DRIVE_CLIENT_ID: "dummy"
          VITE_GOOGLE_DRIVE_FOLDER_ID: "dummy"
          VITE_GOOGLE_PHOTOS_CLIENT_ID: "dummy"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (npm run commit -- 99 "chore: regenerate screenshots [skip ci]" && git push)
